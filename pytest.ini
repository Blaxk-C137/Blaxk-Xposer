[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # PyGObject (3.56.3 and 3.58.0) still uses asyncio event-loop-policy APIs
    # internally, deprecated in Python 3.14. Nothing in Xposer calls them.
    ignore:'asyncio.*EventLoopPolicy:DeprecationWarning:gi.events
    ignore:'asyncio.get_event_loop_policy:DeprecationWarning:gi.events
    # gi registers unix_signal_add_full as a deprecated alias of its own;
    # triggered when the GLib main loop is set up, not by our code.
    ignore:GLib.unix_signal_add_full:DeprecationWarning:gi.overrides
